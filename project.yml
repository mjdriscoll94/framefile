name: FrameFile
options:
  bundleIdPrefix: com.framefile
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: W4TS7E96Q9
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.2
targets:
  FrameFile:
    type: application
    platform: iOS
    sources:
      - path: FrameFile
    dependencies:
      - target: FrameFileShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenstash.app
        PRODUCT_NAME: FrameFile
        INFOPLIST_KEY_CFBundleDisplayName: FrameFile
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FrameFile/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrameFile/Resources/FrameFile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      gatherCoverageData: true
      testTargets:
        - FrameFileTests
        - FrameFileUITests
  FrameFileShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: FrameFileShareExtension
      - path: FrameFile/Shared/SharedImportQueue.swift
      - path: FrameFile/Shared/SharedCategoryCatalog.swift
      - path: FrameFile/Models/ScreenshotCategory.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screenstash.app.share
        PRODUCT_NAME: FrameFileShareExtension
        INFOPLIST_KEY_CFBundleDisplayName: Add to FrameFile
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FrameFileShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FrameFileShareExtension/FrameFileShareExtension.entitlements
  FrameFileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrameFileTests
    dependencies:
      - target: FrameFile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framefile.tests
        GENERATE_INFOPLIST_FILE: YES
  FrameFileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FrameFileUITests
    dependencies:
      - target: FrameFile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.framefile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FrameFile

# Compatibility alias for the existing Xcode Cloud workflow. The scheme name
# remains internal; every buildable product and customer-facing name is FrameFile.
schemes:
  ScreenStash:
    build:
      targets:
        FrameFile: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FrameFileTests
        - FrameFileUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
